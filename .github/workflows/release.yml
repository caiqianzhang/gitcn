name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 允许创建 GitHub Release 并上传产物

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe 需要完整 tag 历史
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Test
        run: go test -race ./...
      - name: Build binaries
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/release.sh
      - name: Smoke test
        run: |
          tar -xzf "dist/gitcn-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C dist
          ./dist/gitcn version
          ./dist/gitcn nodes list
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
